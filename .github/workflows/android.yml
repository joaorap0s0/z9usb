name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build with Gradle (CI Optimized)
      # --no-daemon and JVM args prevent GitHub runner memory crashes
      # --console=plain stops Gradle from hiding errors in the UI
      run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError" --console=plain

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
    - name: Upload Error Reports (If Failed)
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: gradle-build-reports
        path: app/build/reports/
